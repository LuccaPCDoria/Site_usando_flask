<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 120"
     width="120" height="120"
     role="img" aria-label="Ondinhas">
  <title>Ondinhas</title>

  <!-- Background (transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Wave style -->
  <g fill="none" stroke="#0d6efd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top wave -->
    <path d="M10 30 C 25 10, 45 50, 60 30 C 75 10, 95 50, 110 30" />
    <!-- Middle wave -->
    <path d="M10 60 C 25 40, 45 80, 60 60 C 75 40, 95 80, 110 60" />
    <!-- Bottom wave -->
    <path d="M10 90 C 25 70, 45 110, 60 90 C 75 70, 95 110, 110 90" />
  </g>
</svg>
