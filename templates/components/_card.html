<div class="card shadow-sm border-0 h-100">

    <img src="{{ url_for('static', filename='images/' + praia.img) }}"
         class="card-img-top rounded-top"
         alt="Imagem da praia {{ praia.titulo }}">

    <div class="card-body d-flex flex-column">

        <h5 class="card-title text-primary fw-bold">
            {{ praia.titulo }}
        </h5>

        <p class="card-text text-muted small">
            Explore detalhes, localização e curiosidades sobre esta praia maravilhosa.
        </p>

        <div class="mt-auto">
            <a href="{{ url_for('praias', slug=praia.slug) }}"
               class="btn btn-primary w-100">
                Ver detalhes
                <i class="bi bi-arrow-right ms-1"></i>
            </a>
        </div>

    </div>

</div>
