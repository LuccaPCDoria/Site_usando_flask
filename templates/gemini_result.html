{% extends "base.html" %}
{% block title %}Resultado da IA{% endblock %}

{% block content %}

<div class="text-center mb-4">
    <h1 class="fw-bold text-primary">Resposta da IA</h1>
    <p class="text-muted">Confira abaixo a resposta gerada pelo modelo.</p>
</div>

<div class="card border-0 shadow-sm p-4">

    <h5 class="fw-bold text-primary">Sua pergunta:</h5>
    <p class="text-muted">{{ pergunta }}</p>

    <hr>

    <h5 class="fw-bold text-primary">Resposta da IA:</h5>
    <div class="mt-4">
        {{ resposta | safe }}
    </div>

</div>

<div class="text-center mt-4">
    <a href="{{ url_for('gemini') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Fazer outra pergunta
    </a>
</div>

{% endblock %}
